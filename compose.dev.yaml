name: hireyar-dev
services:
  postgres:
    image: postgres:18.3-alpine
    environment:
      POSTGRES_USER: hireyar
      POSTGRES_DB: hireyar_development
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 10s
      timeout: 5s
      retries: 20
  mailpit:
    image: axllent/mailpit:v1.27.10
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
  api:
    build: .
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      AllowedHosts: localhost
      ConnectionStrings__Default: "Host=postgres;Port=5432;Database=hireyar_development;Username=hireyar;Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}"
      Security__SigningKey: ${JWT_SIGNING_KEY:?Set JWT_SIGNING_KEY in .env}
      Security__Issuer: HireYar.Development
      Security__Audience: HireYar.Panel
      Security__FrontendUrl: http://localhost:4200
      Security__AllowedOrigins__0: http://localhost:4200
      Security__DataProtectionPath: /keys
      Smtp__Host: mailpit
      Smtp__Port: 1025
      Smtp__From: no-reply@hireyar.test
      Smtp__EnableSsl: "false"
    ports:
      - "127.0.0.1:5080:8080"
    volumes:
      - protection-keys:/keys
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started
volumes:
  postgres-data:
  protection-keys:
