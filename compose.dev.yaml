name: hireyar-dev
services:
  sql:
    image: mcr.microsoft.com/mssql/server:2022-CU21-ubuntu-22.04
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SQL_PASSWORD:?Set SQL_PASSWORD in .env}
      MSSQL_PID: Developer
    ports:
      - "127.0.0.1:14333:1433"
    volumes:
      - sql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", '/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q "SELECT 1" -b -o /dev/null']
      interval: 10s
      timeout: 5s
      retries: 20
  mailpit:
    image: axllent/mailpit:v1.27.10
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
  api:
    build: .
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      AllowedHosts: localhost
      ConnectionStrings__Default: "Server=sql;Database=HireYar_Development;User Id=sa;Password=${SQL_PASSWORD:?Set SQL_PASSWORD};TrustServerCertificate=True"
      Security__SigningKey: ${JWT_SIGNING_KEY:?Set JWT_SIGNING_KEY in .env}
      Security__Issuer: HireYar.Development
      Security__Audience: HireYar.Panel
      Security__FrontendUrl: http://localhost:4200
      Security__AllowedOrigins__0: http://localhost:4200
      Security__DataProtectionPath: /keys
      Smtp__Host: mailpit
      Smtp__Port: 1025
      Smtp__From: no-reply@hireyar.test
      Smtp__EnableSsl: "false"
    ports:
      - "127.0.0.1:5080:8080"
    volumes:
      - protection-keys:/keys
    depends_on:
      sql:
        condition: service_healthy
      mailpit:
        condition: service_started
volumes:
  sql-data:
  protection-keys:

