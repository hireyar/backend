
name: hireyar

services:
  hireyar-api:
    image: hireyar-api:latest
    container_name: hireyar-api

    build:
      context: .
      dockerfile: Dockerfile

    ports:
      - "192.168.105.73:5080:8080"

    environment:
      ASPNETCORE_ENVIRONMENT: Production
      AllowedHosts: api.hireyar.com
#      ConnectionStrings__Default: "${HIREYAR_DB_CONNECTION:?Set the production PostgreSQL connection string outside Git}"
#      Security__SigningKey: "${HIREYAR_SIGNING_KEY:?Set the production JWT signing key outside Git}"

#      Security__Issuer: "HireYar"
#      Security__Audience: "HireYar.Panel"

      Security__FrontendUrl: "https://hireyar.com"
      Security__AllowedOrigins__0: "https://hireyar.com"
#      Security__AccessMinutes: "60"
#      Security__RefreshDays: "30"
      Security__DataProtectionPath: "/keys"
      ASPNETCORE_TEMP: /app/upload-temp


    volumes:
      - protection-keys:/keys
      - interview-storage:/app/storage/interviews
      - upload-temp:/app/upload-temp

    restart: unless-stopped

volumes:
  protection-keys:
  interview-storage:
  upload-temp:

