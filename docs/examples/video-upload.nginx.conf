# Snippet for the EXISTING HTTPS server; adapt the upstream to the deployment.
# 512 MiB file payload + multipart overhead; API still enforces 512 MiB actual video.
location /api/candidate/interviews/ {
    client_max_body_size 514m;
    client_body_timeout 600s;
    proxy_send_timeout 600s;
    proxy_read_timeout 600s;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass http://127.0.0.1:5080;
}
